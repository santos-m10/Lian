<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari do Lian</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#1b1b1b,#2a2a2a);
    padding:20px;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:420px;
}

/* CAIXA SAFARI */

.safari-box{
    background:#fff8f0;
    border-radius:24px;
    padding:28px;
    border:2px solid #f1e3d3;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    text-align:center;
}

/* EMOJI */

.emoji{
    font-size:48px;
    margin-bottom:12px;
    animation:balanco 2s infinite ease-in-out;
}

/* TITULO */

.titulo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

/* TEXTO */

.texto{
    font-size:16px;
    line-height:1.5;
    color:#333;
}

/* DICA SAFARI */

.dica{
    margin-top:18px;
    background:#fff3e6;
    padding:14px;
    border-radius:14px;
    font-weight:bold;
    color:#7a4d16;
}

/* PEGADAS */

.pegadas{
    margin-top:18px;
    font-size:20px;
    opacity:0.6;
    letter-spacing:6px;
}

/* ANIMAÇÃO */

@keyframes balanco{
    0%{transform:rotate(0deg)}
    25%{transform:rotate(6deg)}
    50%{transform:rotate(0deg)}
    75%{transform:rotate(-6deg)}
    100%{transform:rotate(0deg)}
}

/* RESPONSIVIDADE */

@media (max-width:480px){

    .safari-box{
        padding:22px;
    }

    .titulo{
        font-size:22px;
    }

    .texto{
        font-size:15px;
    }

    .emoji{
        font-size:42px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="safari-box">

        <div class="emoji">🦁</div>

        <div class="titulo">
            Safari Encerrado
        </div>

        <div class="texto">
            O prazo para confirmar presença no<br>
            <b>Safari do Lian</b> já terminou.
        </div>

        <div class="dica">
            ⏳ A aventura já começou!
        </div>

        <div class="pegadas">
            🐾 🐾 🐾
        </div>

    </div>

</div>

<script>

/* Pequeno efeito de console apenas decorativo */
console.log("Convite encerrado 🦁");

</script>

</body>
</html>
