<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lista de Confirmações</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #1b1b1b;
            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* título */
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* container principal */
        #lista {
            width: 100%;
            max-width: 1100px;

            display: grid;
            gap: 18px;

            grid-template-columns: 1fr;
        }

        /* tablet */
        @media(min-width:600px) {
            #lista {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* notebook */
        @media(min-width:900px) {
            #lista {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* card */
        .card {
            background: #2a2a2a;
            padding: 18px;
            border-radius: 16px;

            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);

            display: flex;
            flex-direction: column;
            gap: 8px;

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* status */
        .status {
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 10px;
            width: fit-content;
        }

        .vai {
            background: #2ecc71;
            color: #000;
        }

        .nao {
            background: #e74c3c;
        }

        /* textos */
        .label {
            color: #f4b36c;
            font-weight: bold;
        }
    </style>



</head>

<body>

    <h1>🦁 Confirmações do Safari</h1>

    <div id="lista"></div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>


        const firebaseConfig = {
            apiKey: "AIzaSyBp1Eg-iBbpRnvPs7myiwGsBqe3OS_lF6Q",
            authDomain: "safari-999a2.firebaseapp.com",
            projectId: "safari-999a2",
            storageBucket: "safari-999a2.firebasestorage.app",
            messagingSenderId: "73459075157",
            appId: "1:73459075157:web:5a509308b51ba9a52d2cdc"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const lista = document.getElementById("lista");

        db.collection("confirmacoes")
            .orderBy("data", "desc")
            .get()
            .then(snapshot => {

                snapshot.forEach(doc => {

                    const d = doc.data();

                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
<div class="status ${d.status === "vai" ? "vai" : "nao"}">
${d.status.toUpperCase()}
</div>

<div><span class="label">Adultos:</span> ${d.adultos?.join(", ") || "-"}</div>
<div><span class="label">Crianças:</span> ${d.criancas?.join(", ") || "-"}</div>
<div><span class="label">Nome:</span> ${d.nome || "-"}</div>
`;

                    lista.appendChild(card);

                });

            });



    </script>

</body>

</html>
